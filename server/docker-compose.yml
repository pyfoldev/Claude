# Запуск: cp .env.example .env && nano .env && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: staika
      POSTGRES_USER: staika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staika -d staika"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      STAIKA_DB_URL: postgres://staika:${POSTGRES_PASSWORD}@db:5432/staika?sslmode=disable
      STAIKA_TRUST_PROXY: "true"   # за Caddy берём реальный IP из X-Forwarded-For
    volumes:
      - workspaces:/app/data/workspaces

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      STAIKA_DOMAIN: ${STAIKA_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  workspaces:
  caddy_data:
  caddy_config:
