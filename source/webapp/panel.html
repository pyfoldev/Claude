<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1020">
  <title>Панель</title>
  <link rel="stylesheet" href="/webapp/panel.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="bar">
    <label class="picker">
      <span class="picker-text"><span id="chatTitle" class="picker-title">Панель</span><span id="chatSub" class="picker-sub"></span></span>
      <span id="chatChevron" class="picker-chevron" aria-hidden="true"></span>
      <select id="chat" aria-label="Выбрать чат"></select>
    </label>
  </header>
  <main id="view" tabindex="-1" aria-live="polite"></main>
  <nav id="tabs" class="tabbar" role="tablist" aria-label="Разделы"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/webapp/icons.js"></script>
  <script src="/webapp/i18n.js"></script>
  <script src="/webapp/panel.js"></script>
</body>
</html>
