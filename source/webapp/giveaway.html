<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Конкурс</title>
  <link rel="stylesheet" href="/webapp/style.css">
  <link rel="stylesheet" href="/webapp/giveaway.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main>
    <p id="title">🎁 Конкурс</p>
    <p id="meta"></p>
    <p id="hint">Введите код с картинки — это защита от ботов</p>
    <div id="slot"></div>
    <input id="answer" type="text" inputmode="text" maxlength="8" autocomplete="off"
           autocapitalize="characters" spellcheck="false" placeholder="Код" aria-label="Код с картинки">
    <button id="submit" type="button" disabled>Участвовать</button>
    <p id="status" role="status"></p>
  </main>
  <script src="/webapp/giveaway.js"></script>
</body>
</html>
